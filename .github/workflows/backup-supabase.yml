name: Backup Supabase

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL Client 17
        uses: install-pg/setup-postgres@v1
        with:
          postgres-version: '17'

      - name: Create backup
        run: |
          pg_dump "${{ secrets.SUPABASE_BACKUP_URL }}" -f gebya-backup.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: gebya-backup
          path: gebya-backup.sql
          retention-days: 3
