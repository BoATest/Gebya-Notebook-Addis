name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  api-server:
    name: API server tests + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/api-server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck

  gebya:
    name: Gebya frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/gebya
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/gebya/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: i18n character check
        run: pnpm lint:i18n
      - name: Build
        run: pnpm build
